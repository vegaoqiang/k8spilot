---

- name: Check Helm is already installed
  ansible.builtin.command: helm version
  register: helm_check
  ignore_errors: true
  changed_when: false
  failed_when: false

- name: Install Helm Tools
  ansible.builtin.import_tasks: helm.yml
  when: helm_check.rc != 0

- name: Create Components Directory
  ansible.builtin.file:
    path: "{{ component_path }}"
    state: directory
    mode: '0755'
  delegate_to: localhost
  run_once: true

- name: Install CNI Plugin
  ansible.builtin.include_role:
    name: "{{ cni_provider }}"

- name: Install CoreDNS
  ansible.builtin.import_tasks: coredns.yml

- name: Install CSI Driver
  ansible.builtin.include_role:
    name: csi
  when: enable_csi_nfs

- name: Install Ingress
  ansible.builtin.include_role:
    name: ingress
  when: enable_ingress and ingress_controller == 'ingress-nginx'